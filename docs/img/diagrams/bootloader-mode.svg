<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" role="img" aria-labelledby="t d">
  <title id="t">Entering bootloader mode</title>
  <desc id="d">Side view of the radio. Step 1: hold the PTT button on the left side. Step 2: while holding it, turn the volume knob on top to switch on. The torch LED on top lights and the screen stays blank.</desc>
  <style>
    .body{fill:#2b3138}.edge{fill:#3c444d}.knob{fill:#ff7a1a}.ptt{fill:#ffd23f;stroke:#b8860b;stroke-width:2}
    .ant{fill:#1d2126}.lcd{fill:#c9d6c9}.txt{font:600 17px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#16212b}
    .sm{font:400 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#3b4a56}
    .num{font:700 15px system-ui,sans-serif;fill:#fff}.arrow{fill:none;stroke:#0b7285;stroke-width:3.5;stroke-linecap:round}
    .glow{fill:#fff7c2;stroke:#f3c623;stroke-width:2}
  </style>
  <rect width="580" height="360" fill="#ffffff"/>
  <!-- antenna and knob -->
  <rect class="ant" x="196" y="22" width="26" height="78" rx="9"/>
  <rect class="knob" x="252" y="52" width="40" height="44" rx="8"/>
  <path class="arrow" d="M244 44 a30 22 0 0 1 56 0" />
  <path d="M300 44 l-10 -4 l3 10 z" fill="#0b7285"/>
  <!-- body -->
  <rect class="body" x="180" y="96" width="136" height="236" rx="16"/>
  <rect class="lcd" x="196" y="118" width="104" height="62" rx="4"/>
  <rect class="edge" x="196" y="196" width="104" height="120" rx="8"/>
  <!-- torch LED, on the top edge -->
  <circle class="glow" cx="232" cy="98" r="9"/>
  <!-- PTT on the left side -->
  <rect class="ptt" x="164" y="150" width="22" height="58" rx="6"/>
  <!-- callouts -->
  <circle cx="92" cy="179" r="13" fill="#0b7285"/><text class="num" x="87" y="184">1</text>
  <text class="txt" x="14" y="214">Hold PTT</text>
  <text class="sm" x="14" y="234">and keep holding</text>
  <path class="arrow" d="M108 179 L156 179"/>
  <circle cx="352" cy="58" r="13" fill="#0b7285"/><text class="num" x="347" y="63">2</text>
  <text class="txt" x="372" y="56">Switch on</text>
  <text class="sm" x="372" y="76">turn the volume knob</text>
  <circle cx="352" cy="148" r="13" fill="#0b7285"/><text class="num" x="347" y="153">3</text>
  <text class="txt" x="372" y="146">Torch lights,</text>
  <text class="txt" x="372" y="166">screen stays blank</text>
  <text class="sm" x="372" y="186">let go of PTT</text>
  <path class="arrow" d="M338 140 L246 102"/>
</svg>
