<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
  <title id="t">The label under the battery</title>
  <desc id="d">Two simplified labels. The older radio's label shows the model and a barcode with no version mark. The newer radio's label shows model UV-K5(99) and the letters V3 beside the barcode, highlighted.</desc>
  <style>
    .lab{fill:#f6f7f8;stroke:#9aa7b1;stroke-width:2}.h{font:700 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#16212b}
    .s{font:400 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#3b4a56}.bar{fill:#16212b}
    .v3{font:800 26px system-ui,sans-serif;fill:#b32d1f}.ring{fill:none;stroke:#b32d1f;stroke-width:3}
    .cap{font:600 15px system-ui,sans-serif;fill:#16212b}
  </style>
  <rect width="520" height="300" fill="#ffffff"/>
  <!-- older radio -->
  <text class="cap" x="20" y="28">Older UV-K5 / UV-K5(8)</text>
  <rect class="lab" x="20" y="40" width="220" height="190" rx="8"/>
  <text class="h" x="36" y="68">QUANSHENG</text>
  <text class="s" x="36" y="90">Model: UV-K5(8)</text>
  <text class="s" x="36" y="110">S/N: ••••••••••</text>
  <g transform="translate(36,128)">
    <rect class="bar" x="0" width="3" height="54"/><rect class="bar" x="6" width="2" height="54"/><rect class="bar" x="11" width="4" height="54"/>
    <rect class="bar" x="18" width="2" height="54"/><rect class="bar" x="23" width="3" height="54"/><rect class="bar" x="29" width="5" height="54"/>
    <rect class="bar" x="37" width="2" height="54"/><rect class="bar" x="42" width="3" height="54"/><rect class="bar" x="48" width="2" height="54"/>
    <rect class="bar" x="53" width="4" height="54"/><rect class="bar" x="60" width="2" height="54"/><rect class="bar" x="65" width="3" height="54"/>
    <rect class="bar" x="71" width="2" height="54"/><rect class="bar" x="76" width="5" height="54"/><rect class="bar" x="84" width="2" height="54"/>
    <rect class="bar" x="89" width="3" height="54"/><rect class="bar" x="95" width="2" height="54"/><rect class="bar" x="100" width="4" height="54"/>
    <rect class="bar" x="107" width="2" height="54"/><rect class="bar" x="112" width="3" height="54"/><rect class="bar" x="118" width="2" height="54"/>
  </g>
  <text class="s" x="36" y="212">no version mark</text>
  <!-- newer radio -->
  <text class="cap" x="280" y="28">UV-K5 V3 (newer)</text>
  <rect class="lab" x="280" y="40" width="220" height="190" rx="8"/>
  <text class="h" x="296" y="68">QUANSHENG</text>
  <text class="s" x="296" y="90">Model: UV-K5(99)</text>
  <text class="s" x="296" y="110">S/N: ••••••••••</text>
  <g transform="translate(296,128)">
    <rect class="bar" x="0" width="3" height="54"/><rect class="bar" x="6" width="2" height="54"/><rect class="bar" x="11" width="4" height="54"/>
    <rect class="bar" x="18" width="2" height="54"/><rect class="bar" x="23" width="3" height="54"/><rect class="bar" x="29" width="5" height="54"/>
    <rect class="bar" x="37" width="2" height="54"/><rect class="bar" x="42" width="3" height="54"/><rect class="bar" x="48" width="2" height="54"/>
    <rect class="bar" x="53" width="4" height="54"/><rect class="bar" x="60" width="2" height="54"/><rect class="bar" x="65" width="3" height="54"/>
    <rect class="bar" x="71" width="2" height="54"/><rect class="bar" x="76" width="5" height="54"/><rect class="bar" x="84" width="2" height="54"/>
    <rect class="bar" x="89" width="3" height="54"/><rect class="bar" x="95" width="2" height="54"/>
  </g>
  <text class="v3" x="420" y="166">V3</text>
  <ellipse class="ring" cx="438" cy="157" rx="32" ry="23"/>
  <text class="s" x="296" y="212">“V3” beside the barcode</text>
  <text class="s" x="20" y="262">Simplified drawing: real labels differ in layout and wording.</text>
  <text class="s" x="20" y="282">What matters is the V3 mark, or a model of UV-K1.</text>
</svg>
